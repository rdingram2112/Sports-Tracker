<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2b3a"/>
      <stop offset="1" stop-color="#0e141c"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a5c"/>
      <stop offset="1" stop-color="#d4561c"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.07" stroke-width="6">
    <line x1="170" y1="330" x2="854" y2="330"/>
    <line x1="170" y1="500" x2="854" y2="500"/>
    <line x1="170" y1="670" x2="854" y2="670"/>
  </g>
  <!-- rising bars -->
  <g fill="url(#bar)">
    <rect x="190" y="600" width="120" height="224" rx="22"/>
    <rect x="360" y="480" width="120" height="344" rx="22"/>
    <rect x="530" y="380" width="120" height="444" rx="22"/>
    <rect x="700" y="250" width="120" height="574" rx="22"/>
  </g>
  <!-- baseline -->
  <rect x="160" y="824" width="690" height="22" rx="11" fill="#ffffff" fill-opacity="0.85"/>
  <!-- trend line -->
  <polyline points="250,520 420,400 590,300 760,170" fill="none" stroke="#ffffff" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#ffffff">
    <circle cx="250" cy="520" r="34"/><circle cx="420" cy="400" r="34"/><circle cx="590" cy="300" r="34"/><circle cx="760" cy="170" r="40"/>
  </g>
  <circle cx="760" cy="170" r="18" fill="#d4561c"/>
</svg>
